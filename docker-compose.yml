services:
  # Mindaptive — the original responder. Unchanged.
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"

  # AeroDefense — same image, different client. The responder is one Smartlead
  # account per process by design (see app/accounts.py), so a second client is a
  # second container with its own env file: its own key, database, model,
  # cadence, categories and webhook secret. CLIENT_DIR (set in .env.aerodefense)
  # points it at clients/aerodefense for the prompt, knowledge base, personas
  # and signatures. Its data lives in ./data-aerodefense so the two databases
  # never mix.
  #
  # Behind a profile so it stays OFF until deliberately enabled — auto-deploy
  # runs a bare `docker compose up -d --build`, and this service must not change
  # anything for Mindaptive before .env.aerodefense exists on the droplet.
  # To turn it on: create .env.aerodefense, then add COMPOSE_PROFILES=aerodefense
  # to .env and redeploy.
  app-aerodefense:
    profiles: ["aerodefense"]
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.aerodefense
        required: false
    volumes:
      - ./data-aerodefense:/data
    ports:
      - "127.0.0.1:8081:8080"

  # OneBodyLDN — same image, third client. Same pattern as app-aerodefense:
  # own key, database, model, cadence, categories and webhook secret via
  # .env.onebodyldn, CLIENT_DIR pointing at clients/onebodyldn for the
  # prompt, knowledge base, personas and signatures, and its own data volume
  # so nothing mixes with Mindaptive or AeroDefense.
  #
  # Behind a profile so it stays OFF until deliberately enabled — same reason
  # as app-aerodefense. To turn it on: create .env.onebodyldn, then add
  # onebodyldn to COMPOSE_PROFILES in .env (comma-separated with any other
  # active profile, e.g. COMPOSE_PROFILES=aerodefense,onebodyldn) and redeploy.
  app-onebodyldn:
    profiles: ["onebodyldn"]
    build: .
    restart: unless-stopped
    env_file:
      - path: .env.onebodyldn
        required: false
    volumes:
      - ./data-onebodyldn:/data
    ports:
      - "127.0.0.1:8082:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
